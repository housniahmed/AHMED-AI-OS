name: CI

on:
  push:
    branches: [main, 'prp-**']
  pull_request:
    branches: [main, 'prp-**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install '.[postgres]'
      - name: Focused model runtime tests
        run: >-
          pytest -q
          tests/test_model_policy_learning.py
          tests/test_policy_benchmark_cli.py
          tests/test_model_routing_benchmark.py
          tests/test_routing_feature_snapshot.py
          tests/test_ingest_model_quality.py
          tests/test_model_adaptive.py
          tests/test_model_quality.py
          tests/test_model_router.py
          tests/test_model_usage.py
          tests/test_openai_compatible_provider.py
      - name: Full regression suite
        run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: test_os
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-password@localhost:5432/test_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[postgres]'
      - run: pytest -q tests/test_postgres_memory_integration.py tests/test_postgres_governance_integration.py
      - run: pytest -q tests/test_migrations_rls.py tests/test_postgres_identity_service.py tests/test_persistent_memory_service.py tests/test_durable_governance_service.py tests/test_durable_gateway.py tests/test_persistent_bootstrap.py
      - name: Process recovery under runtime role
        run: |
          python -c "import os,psycopg; c=psycopg.connect(os.environ['TEST_DATABASE_URL'],autocommit=True); c.execute(\"ALTER ROLE ahmed_runtime LOGIN PASSWORD 'ci-runtime-password'\"); c.execute(open('database/runtime_grants.sql').read())"
          TEST_RUNTIME_DATABASE_URL=postgresql://ahmed_runtime:ci-runtime-password@localhost:5432/test_os pytest -q tests/test_process_recovery.py tests/test_approval_transitions.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ahmed-ci .
      - run: |
          docker run -d --name ahmed-ci -p 127.0.0.1:8000:8000 ahmed-ci
          trap 'docker logs ahmed-ci; docker rm -f ahmed-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec ahmed-ci id -u)" = 10001
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = 503

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-disposable-password
      MIGRATION_DATABASE_URL: postgresql://ahmed:ci-disposable-password@postgres:5432/ahmed_ai_os
      RUNTIME_DATABASE_URL: postgresql://ahmed_runtime:ci-runtime-password@postgres:5432/ahmed_ai_os
    steps:
      - uses: actions/checkout@v4
      - name: Integrated staging smoke
        run: |
          set -eu
          trap 'docker compose logs; docker compose down -v' EXIT
          printf 'AHMED_RUNTIME_BACKEND=postgres\nAHMED_OWNER_ID=00000000-0000-4000-8000-000000000001\nAHMED_API_TOKEN=ci-only-token-000000000000000000000000000000\n' > .env.api
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U ahmed -d ahmed_ai_os -v ON_ERROR_STOP=1 -c "CREATE ROLE ahmed_runtime LOGIN PASSWORD 'ci-runtime-password'"
          docker compose run --rm migrate
          docker compose exec -T postgres psql -U ahmed -d ahmed_ai_os -v ON_ERROR_STOP=1 < database/runtime_grants.sql
          docker compose up -d --wait api
          curl -fsS http://127.0.0.1:8000/ready | python -c 'import json,sys; d=json.load(sys.stdin); assert d["database_connected"] and not d["production_ready"]'
          docker compose exec -T postgres psql -U ahmed -d ahmed_ai_os -v ON_ERROR_STOP=1 -c "INSERT INTO user_context(id) VALUES ('00000000-0000-4000-8000-000000000001')"
          docker compose restart api
          docker compose up -d --wait api
          curl -fsS -H 'Authorization: Bearer ci-only-token-000000000000000000000000000000' http://127.0.0.1:8000/v1/users/00000000-0000-4000-8000-000000000001/context
          docker compose stop postgres
          test "$(curl --max-time 20 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = 503
          docker compose up -d --wait postgres
          curl -fsS http://127.0.0.1:8000/ready
          docker compose exec -T postgres pg_dump -U ahmed -Fc ahmed_ai_os > /tmp/ahmed-ci.dump
          docker compose exec -T postgres createdb -U ahmed recovery_ci
          docker compose exec -T postgres pg_restore -U ahmed --exit-on-error -d recovery_ci < /tmp/ahmed-ci.dump
          test "$(docker compose exec -T postgres psql -U ahmed -d recovery_ci -Atc "SELECT count(*) FROM user_context WHERE id='00000000-0000-4000-8000-000000000001'")" = 1
          docker compose exec -T postgres psql -U ahmed -d recovery_ci -v ON_ERROR_STOP=1 -c "UPDATE schema_migrations SET checksum='invalid' WHERE version='001'"
          if docker compose run --rm --no-deps -e DATABASE_URL=postgresql://ahmed_runtime:ci-runtime-password@postgres:5432/recovery_ci api python -c 'from core.system.persistent_bootstrap import check_schema; from core.persistence.connection import PostgresDatabase; check_schema(PostgresDatabase.from_env())' > /tmp/schema-negative.log 2>&1; then exit 1; fi
          grep -q 'incompatible database migrations' /tmp/schema-negative.log
          docker compose restart postgres
          docker compose up -d --wait postgres
          test "$(docker compose exec -T postgres psql -U ahmed -d ahmed_ai_os -Atc "SELECT count(*) FROM user_context WHERE id='00000000-0000-4000-8000-000000000001'")" = 1
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[postgres]' pip-audit
      - run: pip-audit --local --skip-editable
