name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install .
      - name: Focused model runtime tests
        run: >-
          pytest -q
          tests/test_model_policy_learning.py
          tests/test_policy_benchmark_cli.py
          tests/test_model_routing_benchmark.py
          tests/test_routing_feature_snapshot.py
          tests/test_model_adaptive.py
          tests/test_model_quality.py
          tests/test_model_router.py
          tests/test_model_usage.py
          tests/test_openai_compatible_provider.py
      - name: Full regression suite
        run: pytest -q
