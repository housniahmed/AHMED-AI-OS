services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahmed_ai_os}
      POSTGRES_USER: ${POSTGRES_USER:-ahmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["python", "-m", "core.persistence.migrations"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.api
    environment:
      AHMED_AI_OS_ENV: staging
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?RUNTIME_DATABASE_URL must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, outbound]
    volumes:
      - api_data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  database:
    internal: true
  outbound:
volumes:
  postgres_data:
  api_data:
